<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CinqueInContatto</title>
  <style>
    :root {
      --bg: #f4f7ff;
      --card: #ffffff;
      --text: #162238;
      --muted: #5f708f;
      --primary: #4f46e5;
      --secondary: #0ea5e9;
      --ok: #15803d;
      --warn: #b45309;
      --danger: #b91c1c;
      --border: #dce5f2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .container { max-width: 1150px; margin: 0 auto; padding: 1rem; }
    .hero {
      border-radius: 18px;
      padding: 1.2rem;
      color: white;
      background: linear-gradient(135deg, #4338ca 0%, #4f46e5 45%, #0ea5e9 100%);
      box-shadow: 0 12px 30px rgba(27, 35, 70, 0.18);
    }
    h1 { margin: 0 0 .4rem; }
    p { margin: .2rem 0; }
    .small { color: var(--muted); font-size: .9rem; }
    .grid { display: grid; gap: 1rem; }
    .kpi { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); margin-top: 1rem; }
    .main { grid-template-columns: 1fr; margin-top: 1rem; }
    @media (min-width: 960px) { .main { grid-template-columns: 360px 1fr; } }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1rem;
      box-shadow: 0 8px 22px rgba(17, 24, 39, 0.07);
    }
    .kpi-label { color: var(--muted); font-size: .85rem; }
    .kpi-value { font-size: 1.5rem; margin-top: .3rem; font-weight: 700; }
    label { display: block; margin: .65rem 0 .35rem; font-weight: 600; }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: .58rem .65rem;
      font-size: .95rem;
      background: #fff;
    }
    textarea { min-height: 76px; resize: vertical; }
    .row { display: grid; gap: .7rem; grid-template-columns: 1fr 1fr; }
    button {
      border: 0;
      border-radius: 10px;
      padding: .62rem .85rem;
      color: #fff;
      background: var(--primary);
      font-weight: 700;
      cursor: pointer;
      margin-top: .9rem;
    }
    button.alt { background: #475569; }
    button.cyan { background: #0c7fb3; }
    .columns { display: grid; gap: 1rem; grid-template-columns: 1fr; }
    @media (min-width: 960px) { .columns { grid-template-columns: 1fr 1fr; } }
    table { width: 100%; border-collapse: collapse; font-size: .92rem; }
    th, td { text-align: left; border-bottom: 1px solid var(--border); padding: .5rem .2rem; }
    th { color: var(--muted); font-size: .85rem; }
    .badge { display: inline-block; border-radius: 999px; padding: .2rem .52rem; font-weight: 700; font-size: .78rem; }
    .ok { background: #dcfce7; color: #166534; }
    .warn { background: #fef3c7; color: #92400e; }
    .danger { background: #fee2e2; color: #991b1b; }
    .muted { color: var(--muted); }
  </style>
</head>
<body>
  <div class="container">
    <section class="hero">
      <h1>CinqueInContatto 👋</h1>
      <p>Mini app per 5 amici: messaggi rapidi, eventi e task condivisi in un’unica pagina.</p>
      <p class="small" style="color:#dbeafe;">Funziona in locale e salva tutto nel browser con localStorage.</p>
    </section>

    <section id="kpi" class="grid kpi"></section>

    <section class="grid main">
      <article class="card">
        <h2>Aggiungi aggiornamento</h2>
        <label for="author">Amico</label>
        <select id="author">
          <option>Anna</option><option>Luca</option><option>Marta</option><option>Gio</option><option>Sam</option>
        </select>

        <label for="message">Messaggio</label>
        <textarea id="message" placeholder="Es. Chi viene sabato sera?"></textarea>

        <div class="row">
          <div>
            <label for="kind">Tipo</label>
            <select id="kind">
              <option value="chat">Chat</option>
              <option value="evento">Evento</option>
              <option value="task">Task</option>
            </select>
          </div>
          <div>
            <label for="due">Data (opzionale)</label>
            <input id="due" type="date" />
          </div>
        </div>

        <button id="savePost">Pubblica</button>
        <button id="resetApp" class="alt" type="button">Ripristina demo</button>
      </article>

      <article class="card">
        <div class="row">
          <div>
            <label for="filter">Filtra per tipo</label>
            <select id="filter">
              <option value="all">Tutti</option>
              <option value="chat">Chat</option>
              <option value="evento">Eventi</option>
              <option value="task">Task</option>
            </select>
          </div>
          <div>
            <label for="search">Cerca testo</label>
            <input id="search" placeholder="cena, cinema, regalo..." />
          </div>
        </div>

        <div class="columns" style="margin-top:1rem;">
          <div>
            <h2>Bacheca</h2>
            <table>
              <thead><tr><th>Quando</th><th>Amico</th><th>Tipo</th><th>Messaggio</th></tr></thead>
              <tbody id="postRows"></tbody>
            </table>
          </div>
          <div>
            <h2>Prossimi eventi / task</h2>
            <table>
              <thead><tr><th>Data</th><th>Tipo</th><th>Dettaglio</th></tr></thead>
              <tbody id="nextRows"></tbody>
            </table>
            <button id="exportJson" class="cyan" type="button">Esporta backup JSON</button>
          </div>
        </div>
      </article>
    </section>
  </div>

  <script>
    const STORAGE_KEY = 'cinque-in-contatto-v1';
    const demo = {
      posts: [
        { at: '2026-02-06 09:00', author: 'Anna', type: 'chat', text: 'Ragazzi cena venerdì?', due: '' },
        { at: '2026-02-06 11:30', author: 'Luca', type: 'evento', text: 'Partita a calcetto', due: '2026-02-10' },
        { at: '2026-02-06 13:15', author: 'Marta', type: 'task', text: 'Prenotare tavolo per 5', due: '2026-02-09' }
      ]
    };

    const state = loadState();

    function loadState() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return structuredClone(demo);
      try { return JSON.parse(raw); } catch { return structuredClone(demo); }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function nowIt() {
      return new Date().toLocaleString('it-IT', { hour12: false }).replace(',', '');
    }

    function typeBadge(type) {
      if (type === 'evento') return '<span class="badge ok">Evento</span>';
      if (type === 'task') return '<span class="badge warn">Task</span>';
      return '<span class="badge">Chat</span>';
    }

    function renderKpi() {
      const total = state.posts.length;
      const events = state.posts.filter(p => p.type === 'evento').length;
      const tasks = state.posts.filter(p => p.type === 'task').length;
      const activeFriends = new Set(state.posts.map(p => p.author)).size;

      document.getElementById('kpi').innerHTML = `
        <article class="card"><div class="kpi-label">Messaggi totali</div><div class="kpi-value">${total}</div></article>
        <article class="card"><div class="kpi-label">Eventi creati</div><div class="kpi-value">${events}</div></article>
        <article class="card"><div class="kpi-label">Task aperti</div><div class="kpi-value">${tasks}</div></article>
        <article class="card"><div class="kpi-label">Amici attivi</div><div class="kpi-value">${activeFriends}/5</div></article>
      `;
    }

    function renderPosts() {
      const filter = document.getElementById('filter').value;
      const search = document.getElementById('search').value.trim().toLowerCase();

      const rows = [...state.posts].reverse().filter(p => {
        const byType = filter === 'all' || p.type === filter;
        const byText = !search || p.text.toLowerCase().includes(search) || p.author.toLowerCase().includes(search);
        return byType && byText;
      });

      document.getElementById('postRows').innerHTML = rows.map(p => `
        <tr>
          <td>${p.at}</td>
          <td>${p.author}</td>
          <td>${typeBadge(p.type)}</td>
          <td>${p.text}${p.due ? `<div class="small">Scadenza: ${p.due}</div>` : ''}</td>
        </tr>
      `).join('') || '<tr><td colspan="4" class="muted">Nessun messaggio.</td></tr>';
    }

    function renderNext() {
      const rows = state.posts
        .filter(p => p.due)
        .sort((a, b) => a.due.localeCompare(b.due))
        .slice(0, 8);

      document.getElementById('nextRows').innerHTML = rows.map(p => `
        <tr>
          <td>${p.due}</td>
          <td>${typeBadge(p.type)}</td>
          <td>${p.text} <span class="small">(${p.author})</span></td>
        </tr>
      `).join('') || '<tr><td colspan="3" class="muted">Nessuna data in programma.</td></tr>';
    }

    function renderAll() {
      renderKpi();
      renderPosts();
      renderNext();
    }

    function publish() {
      const author = document.getElementById('author').value;
      const text = document.getElementById('message').value.trim();
      const type = document.getElementById('kind').value;
      const due = document.getElementById('due').value;

      if (!text) {
        alert('Scrivi un messaggio prima di pubblicare.');
        return;
      }

      state.posts.push({ at: nowIt(), author, type, text, due });
      saveState();
      document.getElementById('message').value = '';
      document.getElementById('due').value = '';
      renderAll();
    }

    function exportJson() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'cinque-in-contatto-backup.json';
      link.click();
      URL.revokeObjectURL(url);
    }

    function resetDemo() {
      localStorage.removeItem(STORAGE_KEY);
      location.reload();
    }

    document.getElementById('savePost').addEventListener('click', publish);
    document.getElementById('filter').addEventListener('change', renderPosts);
    document.getElementById('search').addEventListener('input', renderPosts);
    document.getElementById('exportJson').addEventListener('click', exportJson);
    document.getElementById('resetApp').addEventListener('click', resetDemo);

    renderAll();
  </script>
</body>
</html>
